<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة لالاند الفلسفية - النسخة العربية</title>
    
    <!-- ربط ملف الستايل -->
    <link rel="stylesheet" href="style.css">
    
    <!-- استيراد Fuse.js من CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- الترويسة -->
        <header>
            <h1>📖 موسوعة لالاند الفلسفية</h1>
            <p>المعجم التقني والنقدي للفلسفة — النسخة العربية</p>
        </header>

        <!-- صندوق البحث -->
        <div class="search-box">
            <input 
                type="search" 
                id="searchInput" 
                placeholder="ابحث عن مصطلح فلسفي... (مثال: العقل، الوجود، الحرية)" 
                autocomplete="off"
                autofocus
            >
        </div>

        <!-- عدّاد النتائج -->
        <div class="result-count" id="resultCount"></div>

        <!-- حاوية النتائج -->
        <div class="results" id="resultsContainer"></div>

        <!-- التذييل -->
        <footer>
            المصدر: موسوعة لالاند الفلسفية، ترجمة خليل أحمد خليل، منشورات عويدات
        </footer>
    </div>

    <!-- ربط ملف الجافا سكريبت (دائماً يكون في الأخير) -->
    <script src="app.js"></script>
</body>
</html>
